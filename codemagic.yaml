workflows:
  ios-app-store:
    name: iOS App Store / TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      # O nome precisa ser exatamente o mesmo da chave em
      # Team settings → Team integrations → Developer Portal.
      app_store_connect: box4pets
    environment:
      groups:
        - box4pets_secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.box4pets.box4Pets
      vars:
        BUNDLE_ID: br.com.box4pets.box4Pets
        BUNDLE_ID_EXTENSION: br.com.box4pets.box4Pets.NotificationExtension
        BOX4PETS_APPLE_ID: "6467569454"
      flutter: 3.47.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create .env from Codemagic secrets
        script: |
          set -euo pipefail
          : "${AIRTABLE_BASE_URL:?Crie o grupo box4pets_secrets no Codemagic com AIRTABLE_BASE_URL}"
          : "${AIRTABLE_TOKEN:?Crie o grupo box4pets_secrets no Codemagic com AIRTABLE_TOKEN}"
          printf '%s\n' \
            "AIRTABLE_BASE_URL=${AIRTABLE_BASE_URL}" \
            "AIRTABLE_TOKEN=${AIRTABLE_TOKEN}" \
            "SMTP_USER=${SMTP_USER:-}" \
            "SMTP_PASSWORD=${SMTP_PASSWORD:-}" \
            > .env
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Check App Store Connect access
        script: |
          echo "API key should see app $BOX4PETS_APPLE_ID ($BUNDLE_ID)"
          app-store-connect get-latest-app-store-build-number "$BOX4PETS_APPLE_ID" --all-versions \
            || echo "WARN: a chave box4pets nao acessa o app $BOX4PETS_APPLE_ID"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          set -euo pipefail
          PUBSPEC_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | tr -d '\r')
          MARKETING_VERSION="${PUBSPEC_VERSION%%+*}"
          PUBSPEC_BUILD="${PUBSPEC_VERSION##*+}"

          LATEST_TF=$(app-store-connect get-latest-testflight-build-number \
            "$BOX4PETS_APPLE_ID" --all-versions || true)
          if [ -n "${LATEST_TF:-}" ] && [ "$LATEST_TF" -eq "$LATEST_TF" ] 2>/dev/null; then
            BUILD_NUMBER=$((LATEST_TF + 1))
          else
            BUILD_NUMBER="$PUBSPEC_BUILD"
          fi

          echo "Building iOS $MARKETING_VERSION ($BUILD_NUMBER)"
          flutter config --no-enable-swift-package-manager
          flutter build ipa --release \
            --build-name="$MARKETING_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Publish IPA to TestFlight
        script: |
          set -euo pipefail
          IPA=$(ls "$CM_BUILD_DIR"/build/ios/ipa/*.ipa | head -n 1)

          XCODE16=$(ls -d /Applications/Xcode-16*.app 2>/dev/null | sort | tail -n 1 || true)
          if [ -n "${XCODE16:-}" ]; then
            export DEVELOPER_DIR="$XCODE16/Contents/Developer"
          fi

          echo "Publishing $IPA"
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-default}"
          echo "ASC key id: ${APP_STORE_CONNECT_KEY_IDENTIFIER:-unset}"
          xcodebuild -version || true
          xcrun --find altool || true

          app-store-connect publish \
            --path "$IPA" \
            --altool-additional-arguments=--use-old-altool
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
